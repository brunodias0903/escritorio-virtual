# Postgres, Valkey e LiveKit descartáveis para o teste de integração (`pnpm smoke`).
# Portas altas, só em 127.0.0.1, para não esbarrar em nada já instalado na máquina.
name: escritorio-virtual-test

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: virtual_office
      POSTGRES_PASSWORD: testpass123
      POSTGRES_DB: virtual_office
    ports:
      - '127.0.0.1:55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U virtual_office -d virtual_office']
      interval: 2s
      timeout: 3s
      retries: 15

  valkey:
    image: valkey/valkey:8-alpine
    command:
      [
        'valkey-server',
        '--requirepass',
        'testvalkey123',
        '--save',
        '',
        '--appendonly',
        'no',
      ]
    ports:
      - '127.0.0.1:5008:6379'
    environment:
      REDISCLI_AUTH: testvalkey123
    healthcheck:
      test: ['CMD-SHELL', 'valkey-cli ping | grep PONG']
      interval: 2s
      timeout: 3s
      retries: 15

  livekit:
    image: livekit/livekit-server:v1.13.11
    environment:
      LIVEKIT_KEYS: 'testkey: testsecret-testsecret-testsecret-1234'
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          node_ip: 127.0.0.1
    ports:
      - '127.0.0.1:57880:7880'
