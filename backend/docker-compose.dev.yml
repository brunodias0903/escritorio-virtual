# Infraestrutura local para desenvolver no seu computador:
#   Postgres (contas, chat, mesas), Valkey (limites e quem está online),
#   Mailpit (caixa de e-mail de teste) e LiveKit (voz e vídeo).
#
#   pnpm dev:infra        sobe tudo (os dados do Postgres ficam guardados)
#   pnpm dev:infra:stop   desliga (sem apagar os dados)
#
# As senhas abaixo são só de teste e valem apenas neste computador.
# As portas ficam só em 127.0.0.1 (exceto as do LiveKit, que o celular usa).
name: escritorio-virtual-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: virtual_office
      POSTGRES_PASSWORD: devpass123
      POSTGRES_DB: virtual_office
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5004:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U virtual_office -d virtual_office']
      interval: 3s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command:
      [
        'valkey-server',
        '--requirepass',
        'devvalkey123',
        '--save',
        '',
        '--appendonly',
        'no',
      ]
    environment:
      REDISCLI_AUTH: devvalkey123
    ports:
      - '127.0.0.1:5005:6379'
    healthcheck:
      test: ['CMD-SHELL', 'valkey-cli ping | grep PONG']
      interval: 3s
      timeout: 3s
      retries: 20

  # Caixa de e-mail de teste: os códigos chegam aqui, em http://localhost:5007
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - '127.0.0.1:5006:1025'
      - '127.0.0.1:5007:8025'

  livekit:
    image: livekit/livekit-server:v1.13.11
    restart: unless-stopped
    environment:
      LIVEKIT_KEYS: 'devkey: devsecret-devsecret-devsecret-12345'
      LIVEKIT_CONFIG: |
        port: 5002
        rtc:
          tcp_port: 5003
          port_range_start: 5100
          port_range_end: 5200
          node_ip: ${LIVEKIT_NODE_IP:-127.0.0.1}
    ports:
      - '5002:5002'
      - '5003:5003'
      - '5100-5200:5100-5200/udp'

volumes:
  postgres-data:
