name: Deploy Dev (MR Preview)

# Cria um ambiente isolado e um link de preview exclusivo para cada MR aberta contra a main
# (e remove automaticamente quando a MR é fechada ou mergeada).
# A main continua intacta apontando para o ambiente principal de produção.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: deploy-dev-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  preview:
    name: Preview da MR via SSH
    runs-on: ubuntu-latest
    steps:
      - name: Verificar secrets da VPS de preview
        id: check
        env:
          DEV_VPS_HOST: ${{ secrets.DEV_VPS_HOST }}
          DEV_VPS_USER: ${{ secrets.DEV_VPS_USER }}
          DEV_VPS_SSH_KEY: ${{ secrets.DEV_VPS_SSH_KEY }}
          DEV_VPS_APP_DIR: ${{ secrets.DEV_VPS_APP_DIR }}
        run: |
          if [ -z "$DEV_VPS_HOST" ] || [ -z "$DEV_VPS_USER" ] || [ -z "$DEV_VPS_SSH_KEY" ] || [ -z "$DEV_VPS_APP_DIR" ]; then
            echo "Servidor de preview ainda não vinculado (secrets DEV_VPS_* ausentes). Pulando preview."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Calcular portas e URL de preview da MR
        if: steps.check.outputs.ready == 'true'
        id: meta
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEV_VPS_HOST: ${{ secrets.DEV_VPS_HOST }}
          DEV_PREVIEW_DOMAIN: ${{ secrets.DEV_PREVIEW_DOMAIN }}
        run: |
          WEB_PORT=$((10000 + PR_NUMBER))
          SERVER_PORT=$((12000 + PR_NUMBER))
          LK_SIGNAL_PORT=$((14000 + PR_NUMBER))
          LK_TCP_PORT=$((16000 + PR_NUMBER))
          LK_UDP_PORT=$((18000 + PR_NUMBER))

          if [ -n "$DEV_PREVIEW_DOMAIN" ]; then
            PREVIEW_HOST="pr-${PR_NUMBER}.${DEV_PREVIEW_DOMAIN}"
            PREVIEW_URL="https://${PREVIEW_HOST}"
            WEB_BIND="127.0.0.1"
          else
            PREVIEW_HOST=""
            PREVIEW_URL="http://${DEV_VPS_HOST}:${WEB_PORT}"
            WEB_BIND="0.0.0.0"
          fi

          {
            echo "pr_number=${PR_NUMBER}"
            echo "web_port=${WEB_PORT}"
            echo "server_port=${SERVER_PORT}"
            echo "lk_signal_port=${LK_SIGNAL_PORT}"
            echo "lk_tcp_port=${LK_TCP_PORT}"
            echo "lk_udp_port=${LK_UDP_PORT}"
            echo "web_bind=${WEB_BIND}"
            echo "preview_host=${PREVIEW_HOST}"
            echo "preview_url=${PREVIEW_URL}"
          } >> "$GITHUB_OUTPUT"

      - name: Configurar chave SSH
        if: steps.check.outputs.ready == 'true'
        env:
          DEV_VPS_HOST: ${{ secrets.DEV_VPS_HOST }}
          DEV_VPS_PORT: ${{ secrets.DEV_VPS_PORT }}
          DEV_VPS_SSH_KEY: ${{ secrets.DEV_VPS_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEV_VPS_SSH_KEY" > ~/.ssh/id_deploy_dev
          chmod 600 ~/.ssh/id_deploy_dev
          PORT="${DEV_VPS_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$DEV_VPS_HOST" >> ~/.ssh/known_hosts

      - name: Iniciar deployment de preview no GitHub
        if: steps.check.outputs.ready == 'true' && github.event.action != 'closed'
        id: deploy_meta
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.meta.outputs.pr_number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_URL: ${{ steps.meta.outputs.preview_url }}
        with:
          script: |
            const environment = `preview-pr-${process.env.PR_NUMBER}`;
            const { data: deployment } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: process.env.HEAD_SHA,
              environment,
              auto_merge: false,
              required_contexts: [],
              transient_environment: true,
              description: `Preview da MR #${process.env.PR_NUMBER}`,
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.id,
              state: 'in_progress',
              environment,
              environment_url: process.env.PREVIEW_URL,
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: 'Construindo e atualizando preview da MR...',
            });
            core.setOutput('deployment_id', String(deployment.id));

      - name: Subir preview isolado da MR
        id: ssh_deploy
        if: steps.check.outputs.ready == 'true' && github.event.action != 'closed'
        env:
          DEV_VPS_HOST: ${{ secrets.DEV_VPS_HOST }}
          DEV_VPS_USER: ${{ secrets.DEV_VPS_USER }}
          DEV_VPS_PORT: ${{ secrets.DEV_VPS_PORT }}
          DEV_VPS_APP_DIR: ${{ secrets.DEV_VPS_APP_DIR }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          BRANCH_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ steps.meta.outputs.pr_number }}
          WEB_PORT: ${{ steps.meta.outputs.web_port }}
          SERVER_PORT: ${{ steps.meta.outputs.server_port }}
          LK_SIGNAL_PORT: ${{ steps.meta.outputs.lk_signal_port }}
          LK_TCP_PORT: ${{ steps.meta.outputs.lk_tcp_port }}
          LK_UDP_PORT: ${{ steps.meta.outputs.lk_udp_port }}
          WEB_BIND: ${{ steps.meta.outputs.web_bind }}
          PREVIEW_HOST: ${{ steps.meta.outputs.preview_host }}
          PREVIEW_URL: ${{ steps.meta.outputs.preview_url }}
        run: |
          PORT="${DEV_VPS_PORT:-22}"
          ssh -i ~/.ssh/id_deploy_dev -p "$PORT" "$DEV_VPS_USER@$DEV_VPS_HOST" bash -s -- \
            "$DEV_VPS_APP_DIR" "$REPO_URL" "$BRANCH_REF" "$PR_NUMBER" \
            "$WEB_PORT" "$SERVER_PORT" "$LK_SIGNAL_PORT" "$LK_TCP_PORT" "$LK_UDP_PORT" \
            "$WEB_BIND" "$PREVIEW_HOST" "$PREVIEW_URL" <<'EOF'
            set -euo pipefail
            BASE_DIR="$1"
            REPO_URL="$2"
            BRANCH="$3"
            PR_NUMBER="$4"
            WEB_PORT="$5"
            SERVER_PORT="$6"
            LK_SIGNAL_PORT="$7"
            LK_TCP_PORT="$8"
            LK_UDP_PORT="$9"
            WEB_BIND="${10}"
            PREVIEW_HOST="${11}"
            PREVIEW_URL="${12}"

            PR_DIR="${BASE_DIR}/previews/pr-${PR_NUMBER}"
            PROJECT_NAME="ev-pr-${PR_NUMBER}"
            mkdir -p "${BASE_DIR}/previews"

            if [ ! -d "${PR_DIR}/.git" ]; then
              git clone --branch "$BRANCH" --single-branch "$REPO_URL" "$PR_DIR"
            fi

            cd "$PR_DIR"
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"

            if [ -f "${BASE_DIR}/.env.preview.base" ]; then
              cp "${BASE_DIR}/.env.preview.base" .env
            elif [ -f "${BASE_DIR}/.env" ]; then
              cp "${BASE_DIR}/.env" .env
            fi

            LIVEKIT_PUBLIC_URL="$(printf '%s' "$PREVIEW_URL" | sed -e 's|^https://|wss://|' -e 's|^http://|ws://|')/livekit"

            printf '\n%s\n' \
              "# Overrides isolados do preview PR #${PR_NUMBER}" \
              "COMPOSE_PROJECT_NAME=${PROJECT_NAME}" \
              "COMPOSE_PROFILES=" \
              "WEB_BIND=${WEB_BIND}" \
              "WEB_PORT=${WEB_PORT}" \
              "PORT=${SERVER_PORT}" \
              "LIVEKIT_SIGNAL_PORT=${LK_SIGNAL_PORT}" \
              "LIVEKIT_TCP_PORT=${LK_TCP_PORT}" \
              "LIVEKIT_UDP_PORT=${LK_UDP_PORT}" \
              "LIVEKIT_PUBLIC_URL=${LIVEKIT_PUBLIC_URL}" \
              "ALLOW_REGISTRATION=false" \
              "ALLOWED_ORIGINS=${PREVIEW_URL}" >> .env

            VERSION="pr-${PR_NUMBER}-$(git rev-parse --short HEAD)" \
              docker compose -p "$PROJECT_NAME" up -d --build --remove-orphans

            # Copia contas autorizadas da main (master, admin, developer, designer, tester) para o banco da preview
            if docker ps --format '{{.Names}}' | grep -qx 'virtual-office-postgres-1'; then
              COLS="$(docker exec virtual-office-postgres-1 psql -U virtual_office -d virtual_office -t -A -c "SELECT string_agg(quote_ident(column_name), ',') FROM information_schema.columns WHERE table_schema='public' AND table_name='local_accounts';" 2>/dev/null || true)"
              if [ -n "$COLS" ]; then
                {
                  printf 'CREATE TEMP TABLE _seed_accounts (LIKE local_accounts);\nCOPY _seed_accounts (%s) FROM STDIN;\n' "$COLS"
                  docker exec virtual-office-postgres-1 psql -U virtual_office -d virtual_office -c "\copy (SELECT ${COLS} FROM local_accounts WHERE tier IN ('master','admin','developer','designer','tester') OR secondary_tiers && ARRAY['master','admin','developer','designer','tester']::text[] OR role = 'admin') TO STDOUT"
                  printf '\\.\nINSERT INTO local_accounts (%s) SELECT %s FROM _seed_accounts ON CONFLICT DO NOTHING;\n' "$COLS" "$COLS"
                } | docker exec -i "${PROJECT_NAME}-postgres-1" psql -U virtual_office -d virtual_office || true
              fi
            fi

            if [ -n "$PREVIEW_HOST" ] && [ -d /etc/caddy/previews ]; then
              printf '%s\n' \
                "${PREVIEW_HOST} {" \
                "    encode zstd gzip" \
                "    reverse_proxy 127.0.0.1:${WEB_PORT}" \
                "}" > "/etc/caddy/previews/pr-${PR_NUMBER}.caddy"
              sudo systemctl reload caddy || true
            elif [ -n "$PREVIEW_HOST" ] && [ -d /etc/icontainer/apps/nginx/nginx/conf/conf.d ]; then
              NGINX_CONF="/etc/icontainer/apps/nginx/nginx/conf/conf.d/pr-${PR_NUMBER}.conf"
              NGINX_WWW="/etc/icontainer/apps/nginx/nginx/www"
              NGINX_CTR="$(docker ps --format '{{.Names}}' | grep '^ic-nginx' | head -n1 || true)"

              printf '%s\n' \
                "server {" \
                "    listen 80;" \
                "    listen [::]:80;" \
                "    server_name ${PREVIEW_HOST};" \
                "    location ^~ /.well-known/acme-challenge/ { root /www; }" \
                "    location / {" \
                "        proxy_pass http://127.0.0.1:${WEB_PORT};" \
                "        proxy_http_version 1.1;" \
                "        proxy_set_header Host \$host;" \
                "        proxy_set_header X-Real-IP \$remote_addr;" \
                "        proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;" \
                "        proxy_set_header X-Forwarded-Proto \$scheme;" \
                "        proxy_set_header Upgrade \$http_upgrade;" \
                "        proxy_set_header Connection \"upgrade\";" \
                "    }" \
                "}" > "$NGINX_CONF"

              if [ -n "$NGINX_CTR" ]; then
                docker exec "$NGINX_CTR" nginx -t && docker exec "$NGINX_CTR" nginx -s reload
              fi

              if command -v certbot >/dev/null 2>&1; then
                if certbot certonly --webroot -w "$NGINX_WWW" -d "$PREVIEW_HOST" --non-interactive --agree-tos --register-unsafely-without-email; then
                  mkdir -p "${NGINX_WWW}/sites/${PREVIEW_HOST}/ssl"
                  cp -L "/etc/letsencrypt/live/${PREVIEW_HOST}/fullchain.pem" "${NGINX_WWW}/sites/${PREVIEW_HOST}/ssl/fullchain.pem"
                  cp -L "/etc/letsencrypt/live/${PREVIEW_HOST}/privkey.pem" "${NGINX_WWW}/sites/${PREVIEW_HOST}/ssl/privkey.pem"

                  printf '%s\n' \
                    "server {" \
                    "    listen 80;" \
                    "    listen [::]:80;" \
                    "    server_name ${PREVIEW_HOST};" \
                    "    location ^~ /.well-known/acme-challenge/ { root /www; }" \
                    "    location / { return 301 https://\$host\$request_uri; }" \
                    "}" \
                    "server {" \
                    "    listen 443 ssl;" \
                    "    listen [::]:443 ssl;" \
                    "    server_name ${PREVIEW_HOST};" \
                    "    ssl_certificate /www/sites/${PREVIEW_HOST}/ssl/fullchain.pem;" \
                    "    ssl_certificate_key /www/sites/${PREVIEW_HOST}/ssl/privkey.pem;" \
                    "    client_max_body_size 25m;" \
                    "    location / {" \
                    "        proxy_pass http://127.0.0.1:${WEB_PORT};" \
                    "        proxy_http_version 1.1;" \
                    "        proxy_set_header Host \$host;" \
                    "        proxy_set_header X-Real-IP \$remote_addr;" \
                    "        proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;" \
                    "        proxy_set_header X-Forwarded-Proto https;" \
                    "        proxy_set_header Upgrade \$http_upgrade;" \
                    "        proxy_set_header Connection \"upgrade\";" \
                    "    }" \
                    "}" > "$NGINX_CONF"

                  if [ -n "$NGINX_CTR" ]; then
                    docker exec "$NGINX_CTR" nginx -t && docker exec "$NGINX_CTR" nginx -s reload
                  fi
                fi
              fi
            fi

            docker compose -p "$PROJECT_NAME" ps
          EOF

      - name: Remover preview da MR fechada
        if: steps.check.outputs.ready == 'true' && github.event.action == 'closed'
        env:
          DEV_VPS_HOST: ${{ secrets.DEV_VPS_HOST }}
          DEV_VPS_USER: ${{ secrets.DEV_VPS_USER }}
          DEV_VPS_PORT: ${{ secrets.DEV_VPS_PORT }}
          DEV_VPS_APP_DIR: ${{ secrets.DEV_VPS_APP_DIR }}
          PR_NUMBER: ${{ steps.meta.outputs.pr_number }}
          PREVIEW_HOST: ${{ steps.meta.outputs.preview_host }}
        run: |
          PORT="${DEV_VPS_PORT:-22}"
          ssh -i ~/.ssh/id_deploy_dev -p "$PORT" "$DEV_VPS_USER@$DEV_VPS_HOST" bash -s -- \
            "$DEV_VPS_APP_DIR" "$PR_NUMBER" "$PREVIEW_HOST" <<'EOF'
            set -euo pipefail
            BASE_DIR="$1"
            PR_NUMBER="$2"
            PREVIEW_HOST="$3"
            PR_DIR="${BASE_DIR}/previews/pr-${PR_NUMBER}"
            PROJECT_NAME="ev-pr-${PR_NUMBER}"

            if [ -d "$PR_DIR" ]; then
              cd "$PR_DIR"
              docker compose -p "$PROJECT_NAME" down -v --remove-orphans || true
              cd "$BASE_DIR"
              rm -rf "$PR_DIR"
            fi

            if [ -f "/etc/caddy/previews/pr-${PR_NUMBER}.caddy" ]; then
              rm -f "/etc/caddy/previews/pr-${PR_NUMBER}.caddy"
              sudo systemctl reload caddy || true
            fi

            NGINX_CONF="/etc/icontainer/apps/nginx/nginx/conf/conf.d/pr-${PR_NUMBER}.conf"
            if [ -f "$NGINX_CONF" ]; then
              rm -f "$NGINX_CONF"
              NGINX_CTR="$(docker ps --format '{{.Names}}' | grep '^ic-nginx' | head -n1 || true)"
              if [ -n "$NGINX_CTR" ]; then
                docker exec "$NGINX_CTR" nginx -t && docker exec "$NGINX_CTR" nginx -s reload
              fi
            fi

            if [ -n "$PREVIEW_HOST" ]; then
              rm -rf "/etc/icontainer/apps/nginx/nginx/www/sites/${PREVIEW_HOST}"
              if command -v certbot >/dev/null 2>&1; then
                certbot delete --cert-name "$PREVIEW_HOST" --non-interactive || true
              fi
            fi
          EOF

      - name: Finalizar deployment de preview no GitHub
        if: always() && steps.deploy_meta.outputs.deployment_id != ''
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_ID: ${{ steps.deploy_meta.outputs.deployment_id }}
          PR_NUMBER: ${{ steps.meta.outputs.pr_number }}
          PREVIEW_URL: ${{ steps.meta.outputs.preview_url }}
          SSH_OUTCOME: ${{ steps.ssh_deploy.outcome || 'success' }}
        with:
          script: |
            const environment = `preview-pr-${process.env.PR_NUMBER}`;
            const ok = process.env.SSH_OUTCOME === 'success';
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID),
              state: ok ? 'success' : 'failure',
              environment,
              environment_url: process.env.PREVIEW_URL,
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: ok
                ? 'Preview pronta para testes.'
                : 'Falha ao subir preview da MR.',
            });

      - name: Encerrar deployments da MR fechada
        if: steps.check.outputs.ready == 'true' && github.event.action == 'closed'
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.meta.outputs.pr_number }}
        with:
          script: |
            const environment = `preview-pr-${process.env.PR_NUMBER}`;
            const { data: deployments } = await github.rest.repos.listDeployments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              environment,
              per_page: 20,
            });
            for (const dep of deployments) {
              await github.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: dep.id,
                state: 'inactive',
                environment,
                description: 'Preview encerrada após fechamento/merge da MR.',
              });
            }
            try {
              await github.rest.repos.deleteAnEnvironment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                environment_name: environment,
              });
            } catch {
              // Ambiente pode já não existir
            }
