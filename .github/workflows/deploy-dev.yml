name: Deploy Dev (MR Preview)

# Cria um ambiente isolado e um link de preview exclusivo para cada MR aberta contra a main
# (e remove automaticamente quando a MR é fechada ou mergeada).
# A main continua intacta apontando para o ambiente principal de produção.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: deploy-dev-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    name: Preview da MR via SSH
    runs-on: ubuntu-latest
    steps:
      - name: Verificar secrets da VPS de preview
        id: check
        env:
          DEV_VPS_HOST: ${{ secrets.DEV_VPS_HOST }}
          DEV_VPS_USER: ${{ secrets.DEV_VPS_USER }}
          DEV_VPS_SSH_KEY: ${{ secrets.DEV_VPS_SSH_KEY }}
          DEV_VPS_APP_DIR: ${{ secrets.DEV_VPS_APP_DIR }}
        run: |
          if [ -z "$DEV_VPS_HOST" ] || [ -z "$DEV_VPS_USER" ] || [ -z "$DEV_VPS_SSH_KEY" ] || [ -z "$DEV_VPS_APP_DIR" ]; then
            echo "Servidor de preview ainda não vinculado (secrets DEV_VPS_* ausentes). Pulando preview."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Calcular portas e URL de preview da MR
        if: steps.check.outputs.ready == 'true'
        id: meta
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEV_VPS_HOST: ${{ secrets.DEV_VPS_HOST }}
          DEV_PREVIEW_DOMAIN: ${{ secrets.DEV_PREVIEW_DOMAIN }}
        run: |
          WEB_PORT=$((10000 + PR_NUMBER))
          SERVER_PORT=$((12000 + PR_NUMBER))
          LK_SIGNAL_PORT=$((14000 + PR_NUMBER))
          LK_TCP_PORT=$((16000 + PR_NUMBER))
          LK_UDP_PORT=$((18000 + PR_NUMBER))

          if [ -n "$DEV_PREVIEW_DOMAIN" ]; then
            PREVIEW_HOST="pr-${PR_NUMBER}.${DEV_PREVIEW_DOMAIN}"
            PREVIEW_URL="https://${PREVIEW_HOST}"
            WEB_BIND="127.0.0.1"
          else
            PREVIEW_HOST=""
            PREVIEW_URL="http://${DEV_VPS_HOST}:${WEB_PORT}"
            WEB_BIND="0.0.0.0"
          fi

          {
            echo "pr_number=${PR_NUMBER}"
            echo "web_port=${WEB_PORT}"
            echo "server_port=${SERVER_PORT}"
            echo "lk_signal_port=${LK_SIGNAL_PORT}"
            echo "lk_tcp_port=${LK_TCP_PORT}"
            echo "lk_udp_port=${LK_UDP_PORT}"
            echo "web_bind=${WEB_BIND}"
            echo "preview_host=${PREVIEW_HOST}"
            echo "preview_url=${PREVIEW_URL}"
          } >> "$GITHUB_OUTPUT"

      - name: Configurar chave SSH
        if: steps.check.outputs.ready == 'true'
        env:
          DEV_VPS_HOST: ${{ secrets.DEV_VPS_HOST }}
          DEV_VPS_PORT: ${{ secrets.DEV_VPS_PORT }}
          DEV_VPS_SSH_KEY: ${{ secrets.DEV_VPS_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEV_VPS_SSH_KEY" > ~/.ssh/id_deploy_dev
          chmod 600 ~/.ssh/id_deploy_dev
          PORT="${DEV_VPS_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$DEV_VPS_HOST" >> ~/.ssh/known_hosts

      - name: Subir preview isolado da MR
        if: steps.check.outputs.ready == 'true' && github.event.action != 'closed'
        env:
          DEV_VPS_HOST: ${{ secrets.DEV_VPS_HOST }}
          DEV_VPS_USER: ${{ secrets.DEV_VPS_USER }}
          DEV_VPS_PORT: ${{ secrets.DEV_VPS_PORT }}
          DEV_VPS_APP_DIR: ${{ secrets.DEV_VPS_APP_DIR }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          BRANCH_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ steps.meta.outputs.pr_number }}
          WEB_PORT: ${{ steps.meta.outputs.web_port }}
          SERVER_PORT: ${{ steps.meta.outputs.server_port }}
          LK_SIGNAL_PORT: ${{ steps.meta.outputs.lk_signal_port }}
          LK_TCP_PORT: ${{ steps.meta.outputs.lk_tcp_port }}
          LK_UDP_PORT: ${{ steps.meta.outputs.lk_udp_port }}
          WEB_BIND: ${{ steps.meta.outputs.web_bind }}
          PREVIEW_HOST: ${{ steps.meta.outputs.preview_host }}
          PREVIEW_URL: ${{ steps.meta.outputs.preview_url }}
        run: |
          PORT="${DEV_VPS_PORT:-22}"
          ssh -i ~/.ssh/id_deploy_dev -p "$PORT" "$DEV_VPS_USER@$DEV_VPS_HOST" bash -s -- \
            "$DEV_VPS_APP_DIR" "$REPO_URL" "$BRANCH_REF" "$PR_NUMBER" \
            "$WEB_PORT" "$SERVER_PORT" "$LK_SIGNAL_PORT" "$LK_TCP_PORT" "$LK_UDP_PORT" \
            "$WEB_BIND" "$PREVIEW_HOST" "$PREVIEW_URL" <<'EOF'
            set -euo pipefail
            BASE_DIR="$1"
            REPO_URL="$2"
            BRANCH="$3"
            PR_NUMBER="$4"
            WEB_PORT="$5"
            SERVER_PORT="$6"
            LK_SIGNAL_PORT="$7"
            LK_TCP_PORT="$8"
            LK_UDP_PORT="$9"
            WEB_BIND="${10}"
            PREVIEW_HOST="${11}"
            PREVIEW_URL="${12}"

            PR_DIR="${BASE_DIR}/previews/pr-${PR_NUMBER}"
            PROJECT_NAME="ev-pr-${PR_NUMBER}"
            mkdir -p "${BASE_DIR}/previews"

            if [ ! -d "${PR_DIR}/.git" ]; then
              git clone --branch "$BRANCH" --single-branch "$REPO_URL" "$PR_DIR"
            fi

            cd "$PR_DIR"
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"

            if [ -f "${BASE_DIR}/.env.preview.base" ]; then
              cp "${BASE_DIR}/.env.preview.base" .env
            elif [ -f "${BASE_DIR}/.env" ]; then
              cp "${BASE_DIR}/.env" .env
            fi

            printf '\n%s\n' \
              "# Overrides isolados do preview PR #${PR_NUMBER}" \
              "COMPOSE_PROJECT_NAME=${PROJECT_NAME}" \
              "COMPOSE_PROFILES=" \
              "WEB_BIND=${WEB_BIND}" \
              "WEB_PORT=${WEB_PORT}" \
              "PORT=${SERVER_PORT}" \
              "LIVEKIT_SIGNAL_PORT=${LK_SIGNAL_PORT}" \
              "LIVEKIT_TCP_PORT=${LK_TCP_PORT}" \
              "LIVEKIT_UDP_PORT=${LK_UDP_PORT}" \
              "ALLOWED_ORIGINS=${PREVIEW_URL}" >> .env

            VERSION="pr-${PR_NUMBER}-$(git rev-parse --short HEAD)" \
              docker compose -p "$PROJECT_NAME" up -d --build --remove-orphans

            if [ -n "$PREVIEW_HOST" ] && [ -d /etc/caddy/previews ]; then
              printf '%s\n' \
                "${PREVIEW_HOST} {" \
                "    encode zstd gzip" \
                "    reverse_proxy 127.0.0.1:${WEB_PORT}" \
                "}" > "/etc/caddy/previews/pr-${PR_NUMBER}.caddy"
              sudo systemctl reload caddy || true
            fi

            docker compose -p "$PROJECT_NAME" ps
          EOF

      - name: Remover preview da MR fechada
        if: steps.check.outputs.ready == 'true' && github.event.action == 'closed'
        env:
          DEV_VPS_HOST: ${{ secrets.DEV_VPS_HOST }}
          DEV_VPS_USER: ${{ secrets.DEV_VPS_USER }}
          DEV_VPS_PORT: ${{ secrets.DEV_VPS_PORT }}
          DEV_VPS_APP_DIR: ${{ secrets.DEV_VPS_APP_DIR }}
          PR_NUMBER: ${{ steps.meta.outputs.pr_number }}
        run: |
          PORT="${DEV_VPS_PORT:-22}"
          ssh -i ~/.ssh/id_deploy_dev -p "$PORT" "$DEV_VPS_USER@$DEV_VPS_HOST" bash -s -- \
            "$DEV_VPS_APP_DIR" "$PR_NUMBER" <<'EOF'
            set -euo pipefail
            BASE_DIR="$1"
            PR_NUMBER="$2"
            PR_DIR="${BASE_DIR}/previews/pr-${PR_NUMBER}"
            PROJECT_NAME="ev-pr-${PR_NUMBER}"

            if [ -d "$PR_DIR" ]; then
              cd "$PR_DIR"
              docker compose -p "$PROJECT_NAME" down -v --remove-orphans || true
              cd "$BASE_DIR"
              rm -rf "$PR_DIR"
            fi

            if [ -f "/etc/caddy/previews/pr-${PR_NUMBER}.caddy" ]; then
              rm -f "/etc/caddy/previews/pr-${PR_NUMBER}.caddy"
              sudo systemctl reload caddy || true
            fi
          EOF

      - name: Comentar link de preview na MR
        if: steps.check.outputs.ready == 'true'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.meta.outputs.preview_url }}
          PR_ACTION: ${{ github.event.action }}
          SHORT_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- preview-deploy-comment -->';
            const shortSha = process.env.SHORT_SHA.slice(0, 7);
            const body = process.env.PR_ACTION === 'closed'
              ? `${marker}\n🧹 **Preview removido:** a MR foi fechada/mergeada e o ambiente isolado foi encerrado.`
              : `${marker}\n🚀 **Preview da MR disponível:** ${process.env.PREVIEW_URL}\n\n- Commit: \`${shortSha}\`\n- O ambiente principal (\`main\`) não foi alterado.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
