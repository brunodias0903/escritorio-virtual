name: virtual-office

# Logs com tamanho limitado, para não encher o disco do servidor.
x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: virtual_office
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env (rode pnpm env:init ou copie .env.example)}
      POSTGRES_DB: virtual_office
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U virtual_office -d virtual_office']
      interval: 5s
      timeout: 5s
      retries: 12

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    logging: *logging
    command:
      - valkey-server
      - --requirepass
      - ${VALKEY_PASSWORD:?defina VALKEY_PASSWORD no .env (rode pnpm env:init ou copie .env.example)}
      - --save
      - ''
      - --appendonly
      - 'no'
    environment:
      REDISCLI_AUTH: ${VALKEY_PASSWORD}
    healthcheck:
      test: ['CMD-SHELL', 'valkey-cli ping | grep PONG']
      interval: 5s
      timeout: 5s
      retries: 12

  # Voz e vídeo (LiveKit). Sinalização interna em :5002 (proxy /livekit no nginx),
  # mídia TCP em 5003 e UDP Mux em 5100 (uma única porta para funcionar igual no Mac, WSL2 e VPS).
  livekit:
    image: livekit/livekit-server:v1.13.11
    restart: unless-stopped
    logging: *logging
    environment:
      LIVEKIT_KEYS: '${LIVEKIT_API_KEY:?defina LIVEKIT_API_KEY no .env}: ${LIVEKIT_API_SECRET:?defina LIVEKIT_API_SECRET no .env}'
      LIVEKIT_CONFIG: |
        port: 5002
        rtc:
          tcp_port: 5003
          udp_port: 5100
          node_ip: ${LIVEKIT_NODE_IP:?defina LIVEKIT_NODE_IP no .env (127.0.0.1 local ou IP público da VPS)}
    ports:
      - '${SERVER_BIND:-127.0.0.1}:5002:5002'
      - '5003:5003'
      - '5100:5100/udp'

  # Caixa de e-mail de teste local (ative com COMPOSE_PROFILES=dev no .env).
  mailpit:
    image: axllent/mailpit:v1.27
    profiles: ['dev']
    restart: unless-stopped
    logging: *logging
    ports:
      - '127.0.0.1:5006:1025'
      - '127.0.0.1:5007:8025'

  server:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: server
      args:
        VERSION: ${VERSION:-local}
    image: virtual-office-server:${IMAGE_TAG:-local}
    restart: unless-stopped
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      SESSION_SECRET: ${SESSION_SECRET:?defina SESSION_SECRET com 32 caracteres ou mais no .env}
      DATABASE_URL: postgres://virtual_office:${POSTGRES_PASSWORD}@postgres:5432/virtual_office
      REDIS_URL: redis://:${VALKEY_PASSWORD}@valkey:6379
      LIVEKIT_URL: ${LIVEKIT_PUBLIC_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      ACCOUNT_DOMAINS: ${ACCOUNT_DOMAINS:-}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      EMAIL_CODES: ${EMAIL_CODES:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Escritório Virtual <nao-responda@exemplo.com>}
    ports:
      - '${SERVER_BIND:-127.0.0.1}:${PORT:-5001}:5001'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5001/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: web
      args:
        VERSION: ${VERSION:-local}
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_WS_URL: ${VITE_WS_URL:-}
    image: virtual-office-web:${IMAGE_TAG:-local}
    restart: unless-stopped
    logging: *logging
    depends_on:
      server:
        condition: service_healthy
      livekit:
        condition: service_started
    environment:
      WS_UPSTREAM: server:5001
      LIVEKIT_UPSTREAM: livekit:5002
    ports:
      - '${WEB_BIND:-127.0.0.1}:${WEB_PORT:-5080}:80'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/healthz']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 2s

  # HTTPS automático (Let's Encrypt) na VPS: ative com COMPOSE_PROFILES=prod no .env.
  caddy:
    image: caddy:2-alpine
    profiles: ['prod']
    restart: unless-stopped
    logging: *logging
    depends_on:
      web:
        condition: service_healthy
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # Cópia diária do PostgreSQL na VPS (ative com COMPOSE_PROFILES=prod no .env).
  backup:
    image: postgres:17-alpine
    profiles: ['prod']
    restart: unless-stopped
    logging: *logging
    entrypoint: ['sh', '/backup.sh']
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
    volumes:
      - ./backend/deploy/backup.sh:/backup.sh:ro
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  backups:
  caddy-data:
  caddy-config:
